replicaCount: 1
image:
  repository: cloudsheger/goldengate-free
  tag: latest
  pullPolicy: IfNotPresent
resources:
  limits:
    cpu: "2"
    memory: "4Gi"
  requests:
    cpu: "1"
    memory: "2Gi"
service:
  type: ClusterIP
  port: 443
persistence:
  enabled: true
  size: 20Gi
  storageClass: gp3
config:
  OGG_HOME: /u01/ogg
  AdminUsername: oggadmin
  AdminPassword: Welcome##123
nodeSelector: {}
tolerations: []
affinity: {}