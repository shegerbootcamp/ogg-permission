apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-goldengate
  labels:
    app: goldengate
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: goldengate
  template:
    metadata:
      labels:
        app: goldengate
    spec:
      securityContext:
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
        supplementalGroups: [1001880000]
       # allowPrivilegeEscalation: false  # Added at the pod level for extra security
      containers:
        - name: goldengate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true    
            runAsUser: 1001880000
          ports:
            - name: https
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: OGG_HOME
              value: "{{ .Values.config.OGG_HOME }}"
            - name: OGG_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-goldengate-secrets
                  key: OGG_ADMIN_USERNAME
            - name: OGG_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-goldengate-secrets
                  key: OGG_ADMIN_PASSWORD
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/healthcheck
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/healthcheck
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            requests:
              memory: "{{ .Values.resources.requests.memory }}"
              cpu: "{{ .Values.resources.requests.cpu }}"
            limits:
              memory: "{{ .Values.resources.limits.memory }}"
              cpu: "{{ .Values.resources.limits.cpu }}"
          {{- if or .Values.persistence.existingClaim .Values.pv.oggData.name }}
          volumeMounts:
            - name: ogg-data
              mountPath: /u01/app/ogg/data
          {{- end }}
      {{- if or .Values.persistence.existingClaim .Values.pv.oggData.name }}
      volumes:
        - name: ogg-data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default .Values.pv.oggData.name }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name | default .Release.Name }}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      affinity: {{ toYaml .Values.affinity | nindent 8 }}